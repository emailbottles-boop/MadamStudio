<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — Madam Studio</title>
<meta name="description" content="Apply to work on Wizard Shit. Send a portfolio and a note; the producers read every application.">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap');

  :root {
    --bg:      #d9e9f4;
    --panel:   #ffffff;
    --panel-2: #eef6fb;
    --border:  #b3cfe1;
    --text:    #16303f;
    --muted:   #5b7c92;
    --accent:  #2176b5;
    --accent-deep: #175a8c;
    --ok:      #1e8e5a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }

  .corner-nav { position: fixed; top: 24px; right: 24px; z-index: 10; display: flex; gap: 10px; }
  .studio-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 3px;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .studio-btn:hover { border-color: var(--accent); background: var(--panel-2); }
  .studio-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 110px 24px 90px; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent-deep);
    margin-bottom: 10px;
  }
  .sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }

  form { display: grid; gap: 12px; }
  label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 11px 12px;
  }
  textarea { min-height: 120px; resize: vertical; }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 3px;
    padding: 12px 20px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn:disabled { opacity: 0.6; cursor: wait; }

  .msg { font-size: 13px; line-height: 1.5; display: none; }
  .msg.err { color: #b3323c; display: block; }
  .msg.ok { color: var(--ok); display: block; }

  .fine { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 22px; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  footer {
    text-align: center;
    padding: 26px 20px 34px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

  <nav class="corner-nav">
    <a class="studio-btn" href="index.html">Madam Studio</a>
  </nav>

  <div class="wrap">
    <p class="eyebrow">Join the crew</p>
    <h1>Apply</h1>
    <p class="sub">Want to work on Wizard Shit? Send your portfolio and a note. The producers read everything.</p>

    <form id="applyForm" novalidate>
      <div>
        <label for="aName">Name</label>
        <input id="aName" type="text" autocomplete="name" maxlength="200">
      </div>
      <div>
        <label for="aEmail">Email</label>
        <input id="aEmail" type="email" autocomplete="email" maxlength="200">
      </div>
      <div>
        <label for="aPortfolio">Portfolio link</label>
        <input id="aPortfolio" type="url" placeholder="https://" maxlength="1000">
      </div>
      <div>
        <label for="aMessage">Message</label>
        <textarea id="aMessage" maxlength="4000"></textarea>
      </div>
      <input type="text" class="hp" name="website" id="aHp" value="" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="btn" id="aSubmit">Send</button>
      <p class="msg" id="aMsg"></p>
    </form>

    <p class="fine">Applications go straight to the producers and are never shown publicly.</p>
  </div>

  <footer>
    &copy; Madam Studio &middot; NFP
  </footer>

<script>
const API = "https://wizardshit.store";
const form = document.getElementById("applyForm");
const email = document.getElementById("aEmail");
const submit = document.getElementById("aSubmit");
const msg = document.getElementById("aMsg");

form.addEventListener("submit", async e => {
  e.preventDefault();
  msg.className = "msg";
  if (!email.validity.valid || !email.value.trim()) {
    msg.textContent = "Add a valid email so we can reply.";
    msg.className = "msg err";
    return;
  }
  submit.disabled = true;
  let result = null;
  try {
    const res = await fetch(API + "/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: document.getElementById("aName").value.trim(),
        email: email.value.trim(),
        portfolio: document.getElementById("aPortfolio").value.trim(),
        message: document.getElementById("aMessage").value.trim(),
        website: document.getElementById("aHp").value,
      }),
    });
    result = { ok: res.ok, data: await res.json().catch(() => ({})) };
  } catch (_) {}
  submit.disabled = false;
  if (result && result.ok) {
    form.reset();
    msg.textContent = "Sent ✓ The producers will be in touch.";
    msg.className = "msg ok";
  } else {
    msg.textContent = (result && result.data && result.data.error) || "Couldn't send — try again soon.";
    msg.className = "msg err";
  }
});
</script>

</body>
</html>
