<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizard Crew — Madam Studio</title>
<meta name="description" content="Crew verification for Madam Studio. Worked on Wizard Shit? Claim your credit identity card and the producers will verify you.">
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap');

  /* Flat light-blue theme — matches index.html, no gradients. */
  :root{
    --bg:#4a1020; --panel:#611829; --panel-2:#742138; --border:#8d3a4e;
    --text:#f7ecd9; --text-2:#e7cfa4; --muted:#cf9bad;
    --accent:#f3c53f; --accent-deep:#d99a1f; --accent-ink:#3a1020;
    --verified:#6fe0a0; --paid:#f3c53f;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }

  .corner-nav {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 10;
    display: flex;
    gap: 10px;
  }

  .studio-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 3px;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .studio-btn:hover { border-color: var(--accent); background: var(--panel-2); }
  .studio-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .head {
    max-width: 900px;
    margin: 0 auto;
    padding: 110px 24px 34px;
    text-align: center;
  }
  .eyebrow {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(30px, 6vw, 46px);
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--accent-deep);
    margin-bottom: 12px;
  }
  .head p {
    font-size: 14px;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.65;
  }

  .grid {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 24px 90px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .id-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    font-family: inherit;
    color: inherit;
  }
  .id-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .id-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .id-photo {
    width: 84px; height: 84px;
    border-radius: 50%;
    margin: 0 auto 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .id-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .id-name { font-family: 'Fraunces', Georgia, serif; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .id-roles {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    white-space: pre-line;
  }
  .id-badge {
    display: inline-block;
    margin-top: 10px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--verified);
    border: 1px solid var(--verified);
    border-radius: 3px;
    padding: 3px 8px;
  }

  .grid-note {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    padding: 30px 0;
  }

  /* ── claim modal ─────────────────────────────────── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 24, 34, 0.6);
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px 26px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .modal .id-photo { width: 72px; height: 72px; }
  .modal h2 { font-family: 'Fraunces', Georgia, serif; font-size: 19px; margin-bottom: 6px; }
  .modal .sub { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 18px; }

  .modal input[type=email] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 11px 12px;
    margin-bottom: 12px;
  }
  .modal input[type=email]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn-row { display: flex; gap: 10px; justify-content: center; }
  .btn {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-radius: 3px;
    padding: 11px 18px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  .btn:hover { border-color: var(--accent); background: var(--panel-2); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn:disabled { opacity: 0.6; cursor: wait; }

  .modal-msg { font-size: 13px; margin-top: 14px; line-height: 1.5; display: none; }
  .modal-msg.err { color: #b3323c; display: block; }
  .modal-msg.ok { color: var(--verified); display: block; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .page-link { margin-top: 16px; font-size: 13px; }
  .page-link a { color: var(--accent); text-decoration: none; }
  .page-link a:hover { text-decoration: underline; }

  .funnel { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .funnel .btn { text-decoration: none; }
  .funnel .note { font-size: 13px; color: var(--muted); width: 100%; margin-top: 4px; }

  footer {
    text-align: center;
    padding: 26px 20px 34px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--text-2); }

  @media (max-width: 480px) {
    .corner-nav { top: 16px; right: 16px; }
    .studio-btn { font-size: 11px; padding: 9px 13px; }
    .head { padding-top: 96px; }
  }
</style>
</head>
<body>

  <nav class="corner-nav">
    <a class="studio-btn" href="/account/">Account</a>
    <a class="studio-btn" href="/">Madam Studio</a>
  </nav>

  <header class="head">
    <h1>Wizard Crew</h1>
    <p id="funnelPrompt"></p>
    <div id="funnel" class="funnel"></div>
  </header>

  <main class="grid" id="grid" aria-label="Crew credit cards">
    <div class="grid-note" id="gridNote">Loading&hellip;</div>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal">
      <div class="id-photo" id="modalPhoto"></div>
      <h2 id="modalName"></h2>
      <p class="sub" id="modalSub"></p>
      <div class="btn-row">
        <button type="button" class="btn" id="claimCancel">Cancel</button>
        <a class="btn primary" id="modalAction" href="#">Visit page</a>
      </div>
      <p class="modal-msg" id="modalMsg"></p>
    </div>
  </div>

  <footer>
    &copy; Madam Studio &middot; NFP
  </footer>

<script>
/* The crew cards come from the same API that powers wizardshit.store's
   credits, so this page never needs editing when the crew changes. If the
   API is unreachable, a baked-in name list keeps the page alive. */
const API = "https://wizardshit.store";

const FALLBACK_CREW = [
  "Sheamus Aaren", "Emman Paraiso", "Pau Medrano", "Ann Nicole",
  "Mohanad Ahmed", "Sapphic Shroom", "Rowan Ashmore", "Charbuz",
];

const grid = document.getElementById("grid");
const overlay = document.getElementById("overlay");
const modalPhoto = document.getElementById("modalPhoto");
const modalName = document.getElementById("modalName");
const modalSub = document.getElementById("modalSub");
const modalAction = document.getElementById("modalAction");
const modalMsg = document.getElementById("modalMsg");

function tok(){ try { return localStorage.getItem("wizAcct") || ""; } catch(_) { return ""; } }
let me = null;      // /api/account/me when logged in, else null
let crewMode = false; // true after "Yes, I'm crew" — clicking a card offers to claim it
let selected = null;

function initials(name) {
  return name.split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase();
}

function photoEl(person) {
  const box = document.createElement("div");
  box.className = "id-photo";
  if (person.photo) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = /^https?:\/\//i.test(person.photo) ? person.photo : API + "/" + person.photo.replace(/^\/+/, "");
    img.onerror = () => { img.remove(); box.textContent = initials(person.name); };
    box.appendChild(img);
  } else {
    box.textContent = initials(person.name);
  }
  return box;
}

function renderCrew(people, verified) {
  grid.innerHTML = "";
  people.forEach(person => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "id-card";
    card.appendChild(photoEl(person));
    const nm = document.createElement("div");
    nm.className = "id-name";
    nm.textContent = person.name;
    card.appendChild(nm);
    if (person.roles) {
      const rl = document.createElement("div");
      rl.className = "id-roles";
      rl.textContent = person.roles;
      card.appendChild(rl);
    }
    if (verified.includes(person.name)) {
      const b = document.createElement("span");
      b.className = "id-badge";
      b.textContent = "✓ Verified";
      card.appendChild(b);
    }
    card.addEventListener("click", () => openModal(person));
    grid.appendChild(card);
  });
}

// Clicking a card: in normal mode it just offers to visit the page. In crew
// mode ("Yes, I'm crew") it offers to claim the card — routed through the
// account so the claim is tied to a real logged-in member, not a loose email.
function openModal(person) {
  selected = person;
  modalName.textContent = person.name;
  modalPhoto.replaceWith(Object.assign(photoEl(person), { id: "modalPhoto" }));
  modalMsg.className = "modal-msg";
  const pageHref = "/creator/?name=" + encodeURIComponent(person.name);

  if (!crewMode) {
    modalSub.textContent = "Visit their page.";
    modalAction.textContent = "Visit page";
    modalAction.href = pageHref;
    modalAction.onclick = null;
  } else if (!me) {
    modalSub.textContent = "Sign in to claim your card.";
    modalAction.textContent = "Sign in";
    modalAction.href = "/account/";
    modalAction.onclick = null;
  } else if (!me.account.email) {
    modalSub.textContent = "Tie your email on your account page first, then come back to claim.";
    modalAction.textContent = "Go to account";
    modalAction.href = "/account/";
    modalAction.onclick = null;
  } else if ((me.creators || []).includes(person.name)) {
    modalSub.textContent = "This card is already yours.";
    modalAction.textContent = "Open hub";
    modalAction.href = pageHref;
    modalAction.onclick = null;
  } else {
    modalSub.textContent = "Claim this card as yours? A producer verifies it, then your hub opens.";
    modalAction.textContent = "Claim this card";
    modalAction.href = "#";
    modalAction.onclick = async (ev) => {
      ev.preventDefault();
      modalAction.style.pointerEvents = "none";
      try {
        const res = await fetch(API + "/api/account/claim", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok() },
          body: JSON.stringify({ name: person.name }),
        });
        const d = await res.json().catch(() => ({}));
        if (res.ok) {
          modalMsg.textContent = d.status === "verified" ? "Already verified ✓" : "Sent for review ✓";
          modalMsg.className = "modal-msg ok";
          me = await fetchMe();
        } else {
          modalMsg.textContent = d.error || "Couldn't send — try again.";
          modalMsg.className = "modal-msg err";
        }
      } catch (_) {
        modalMsg.textContent = "Couldn't reach the studio — try again soon.";
        modalMsg.className = "modal-msg err";
      }
      modalAction.style.pointerEvents = "";
    };
  }
  overlay.classList.add("open");
}
function closeModal() { overlay.classList.remove("open"); selected = null; }

document.getElementById("claimCancel").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

async function fetchMe() {
  if (!tok()) return null;
  try {
    const res = await fetch(API + "/api/account/me", { headers: { "Authorization": "Bearer " + tok() } });
    return res.ok ? await res.json() : null;
  } catch (_) { return null; }
}

async function setRole(role) {
  if (!tok()) return;
  try {
    await fetch(API + "/api/account/role", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tok() },
      body: JSON.stringify({ role }),
    });
  } catch (_) {}
}

// The "Do you work for Madam Studio?" funnel.
function renderFunnel() {
  const f = document.getElementById("funnel");
  const prompt = document.getElementById("funnelPrompt");
  f.innerHTML = "";
  const add = (label, cls, fn, href) => {
    const b = document.createElement(href ? "a" : "button");
    b.className = "btn" + (cls ? " " + cls : "");
    if (href) b.href = href; else b.type = "button";
    b.textContent = label;
    if (fn) b.onclick = fn;
    f.appendChild(b);
    return b;
  };
  if (!me) {
    prompt.textContent = "";
    add("Sign in / sign up", "primary", null, "/account/");
    add("Apply for a position", "", null, "/apply/");
    return;
  }
  if (crewMode) {
    prompt.textContent = "Select your wizard card to access your Madam Studio account.";
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = "Not you? ";
    const back = document.createElement("a");
    back.href = "#"; back.textContent = "go back";
    back.onclick = (e) => { e.preventDefault(); crewMode = false; renderFunnel(); };
    note.appendChild(back);
    f.appendChild(note);
    return;
  }
  prompt.textContent = "Do you work for Madam Studio?";
  add("Yes, I'm crew", "primary", () => { crewMode = true; setRole("crew"); renderFunnel(); });
  add("No, I'm a fan", "", async () => {
    await setRole("fan");
    prompt.textContent = "Following as a fan ✨ Browse the crew below.";
    f.innerHTML = "";
  });
  add("I'd like to apply", "", null, "/apply/");
}

/* load the crew + verified badges + who I am */
(async () => {
  let people = null;
  let verified = [];
  try {
    const res = await fetch(API + "/api/content");
    if (res.ok) {
      const data = await res.json();
      people = (data.credits || []).map(c => ({ name: c.name, roles: c.roles || "", photo: c.photo || "" }));
    }
  } catch (_) {}
  try {
    const res = await fetch(API + "/api/claims-public");
    if (res.ok) verified = (await res.json()).verified || [];
  } catch (_) {}
  if (!people || !people.length) {
    people = FALLBACK_CREW.map(name => ({ name, roles: "", photo: "" }));
  }
  me = await fetchMe();
  renderFunnel();
  renderCrew(people, verified);
})();
</script>

</body>
</html>
