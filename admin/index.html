<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Madam Studio — Control Room</title>
<style>
  :root {
    --bg: #3d0d1b;
    --card: #4f1526;
    --card2: #611829;
    --border: rgba(247,236,217,0.11);
    --border-strong: rgba(247,236,217,0.20);
    --text: #f7ecd9;
    --muted: #cf9bad;
    --accent: #f3c53f;
    --accent-ink: #3a1020;
    --danger: #f2889b;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    padding-bottom: 5rem;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.2rem; }

  header { display: flex; align-items: baseline; gap: 0.75rem; padding: 0.4rem 0 1.4rem; }
  header h1 { font-family: 'Fraunces', Georgia, serif; font-size: 1.3rem; font-weight: 600; letter-spacing: 0; }
  header h1 .at { color: var(--accent); }
  header .sub { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
  #whoami { margin-left: auto; font-size: 0.78rem; color: var(--muted); }

  .tabs { display: flex; gap: 0.25rem; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 1.1rem; }
  .tab {
    padding: 0.55rem 0.9rem;
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
  .btn {
    padding: 0.45rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--card2);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .btn:hover { border-color: rgba(255,255,255,0.3); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #dirtyFlag { font-size: 0.78rem; color: var(--accent); display: none; font-weight: 500; }

  .item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    padding: 1rem 1.1rem;
    margin-bottom: 0.8rem;
  }
  .item.hidden-item { opacity: 0.55; border-style: dashed; }
  .item-head { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.8rem; }
  .item-head .grow { flex: 1; font-weight: 600; font-size: 0.95rem; }
  .icon-btn {
    width: 30px; height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--muted); cursor: pointer; font-size: 0.8rem;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .fields .full { grid-column: 1 / -1; }
  @media (max-width: 620px) { .fields { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.76rem; font-weight: 500; color: var(--muted); margin-bottom: 0.3rem; }
  input[type=text], input[type=password], textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    color: var(--text);
    padding: 0.5rem 0.65rem;
    font: inherit;
    font-size: 0.88rem;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  .check { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--muted); cursor: pointer; }
  .check input { width: 15px; height: 15px; accent-color: var(--accent); }
  .checks { display: flex; gap: 1.1rem; align-items: center; flex-wrap: wrap; padding-top: 0.2rem; }

  .thumb {
    width: 64px; height: 64px; border-radius: 8px; flex-shrink: 0;
    background-size: cover; background-position: center;
    border: 1px solid var(--border-strong);
    background-color: var(--bg);
  }
  .thumb.round { border-radius: 50%; }
  .img-row { display: flex; gap: 0.7rem; align-items: flex-end; }
  .img-row .grow { flex: 1; }
  .dropzone {
    display: flex; gap: 0.9rem; align-items: center;
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    padding: 0.65rem 0.85rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.dragging { border-color: var(--accent); background: rgba(245, 179, 1, 0.06); }
  .drop-hint { flex: 1; font-size: 0.78rem; color: var(--muted); text-align: right; }

  #toast {
    position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%);
    background: var(--card2);
    border: 1px solid var(--border-strong);
    border-left: 3px solid var(--accent);
    color: var(--text);
    border-radius: 8px;
    padding: 0.65rem 1.1rem;
    font-size: 0.85rem;
    z-index: 50;
    display: none;
    max-width: 90vw;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  #toast.error { border-left-color: var(--danger); }

  /* Covers the page from the first paint. Without this the console renders
     first and only gets covered once the auth request comes back, which
     flashes the whole Control Room at anyone who opens the page. */
  #loginOverlay {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 1.5rem;
  }
  #loginOverlay .box {
    width: min(370px, 92vw);
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card);
    padding: 2.1rem 1.8rem 1.9rem;
    text-align: center;
    visibility: hidden;
  }
  #loginOverlay.ask .box {
    visibility: visible;
    animation: rise 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes rise {
    from { transform: translateY(28px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .login-logo { width: 112px; display: block; margin: 0 auto 1rem; }
  #loginOverlay h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.3rem; }
  #loginOverlay h2 .at { color: var(--accent); }
  #loginOverlay p { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.1rem; }
  #loginOverlay input { margin-bottom: 0.8rem; text-align: center; }
  #loginErr { color: var(--danger); font-size: 0.78rem; margin-top: 0.7rem; display: none; }

  .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; font-size: 0.85rem; }

  /* photo framing sliders */
  .framing { display: flex; gap: 1rem; align-items: center; }
  .framing .sliders { flex: 1; display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 0.7rem; align-items: center; }
  .framing .sliders span { font-size: 0.74rem; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .css-link { font-size: 0.74rem; color: var(--muted); cursor: pointer; text-decoration: underline; }
  .css-link:hover { color: var(--text); }

  /* messages inbox */
  .item.unread { border-left: 3px solid var(--accent); }
  .msg-meta { font-size: 0.74rem; color: var(--muted); }
  .msg-body { white-space: pre-wrap; font-size: 0.88rem; line-height: 1.55; }

  /* orders + printful import */
  .order-line { font-size: 0.84rem; color: var(--muted); line-height: 1.6; }
  .order-line a { color: var(--accent); }
  .pf-panel { border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 1rem; background: var(--card); }
  .pf-row { display: flex; gap: 0.8rem; align-items: center; padding: 0.45rem 0; border-bottom: 1px solid var(--border); }
  .pf-row:last-child { border-bottom: none; }
  .pf-row .thumb { width: 40px; height: 40px; }
  .pf-row .grow { flex: 1; font-size: 0.86rem; }
  .pf-note { font-size: 0.74rem; color: var(--muted); margin-top: 0.6rem; }

  /* analytics */
  .stat-tiles { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .tile {
    flex: 1; min-width: 130px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); padding: 0.9rem 1rem;
  }
  .tile .num { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .tile .lbl { font-size: 0.76rem; color: var(--muted); margin-top: 0.15rem; }
  .chart-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 1rem 1.1rem; }
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 140px; }
  .chart .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: 0.9; }
  .chart .bar:hover { opacity: 1; }
  .chart .bar.zero { background: rgba(255,255,255,0.1); }
  .chart-x { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-top: 0.45rem; }
  .range-row { display: flex; gap: 0.4rem; margin-bottom: 0.9rem; }
  .range-btn { padding: 0.35rem 0.8rem; font-size: 0.78rem; }
  .range-btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .chart.monthly { height: 170px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0.25rem; height: 100%; }
  .bar-col .bar { width: 100%; flex: none; }
  .bar-num { font-size: 0.72rem; color: var(--text); font-weight: 600; }
  .bar-mon { font-size: 0.68rem; color: var(--muted); margin-top: 0.25rem; }
  .month-list { margin-top: 1rem; }
  .month-row { display: flex; justify-content: space-between; padding: 0.4rem 0.1rem; border-bottom: 1px solid var(--border); font-size: 0.84rem; }
  .month-row:last-child { border-bottom: none; }
  .month-row .v { font-weight: 600; }
  #barTip {
    position: fixed; z-index: 60; display: none; pointer-events: none;
    background: var(--card2); border: 1px solid var(--border-strong);
    border-radius: 7px; padding: 0.3rem 0.6rem; font-size: 0.76rem; color: var(--text);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .col-label { font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0.2rem 0 0.7rem; font-weight: 700; }
  .col-label:not(:first-child) { margin-top: 1.4rem; }

  /* ===== Creators tab · Board Editor (scoped) ===== */
  .cr-editor { --cr-border: #8d3a4e; --cr-border-soft: #6e2739; --cr-text2: #e7cfa4; --cr-verified: #6fe0a0; --cr-tile: #380e1b; }
  .cr-top { margin-bottom: 0.5rem; }
  .cr-eyebrow { font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 5px; }
  .cr-h1b { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 22px; }
  .cr-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  .cr-cardrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 14px 0 6px; }
  .cr-pcard { position: relative; background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--cr-border-soft); border-radius: 12px; padding: 11px; cursor: pointer; transition: 0.15s; }
  .cr-pcard:hover { border-color: var(--cr-border); }
  .cr-pcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cr-row1 { display: flex; align-items: center; gap: 9px; }
  .cr-av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 12px; color: var(--accent-ink); background-size: cover; background-position: center; }
  .cr-nm { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 13px; line-height: 1.1; }
  .cr-rl { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .cr-thumbs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 9px; }
  .cr-thumbs i { height: 24px; border-radius: 4px; display: block; background: var(--cr-tile); border: 1px solid var(--cr-border-soft); background-size: cover; background-position: center; }
  .cr-gtag { margin-top: 9px; display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--cr-text2); background: #3a0f1d; border: 1px solid var(--cr-border-soft); border-radius: 7px; padding: 4px 7px; cursor: pointer; }
  .cr-gtag:hover { border-color: var(--cr-border); }
  .cr-gdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .cr-chev { margin-left: auto; color: var(--muted); }
  .cr-gmenu { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; background: #3a0f1d; border: 1px solid var(--cr-border-soft); border-radius: 8px; padding: 5px; }
  .cr-gmenu button { text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; color: var(--text); font: inherit; font-size: 11px; padding: 5px 7px; cursor: pointer; }
  .cr-gmenu button:hover { background: #5c1727; border-color: var(--cr-border); }
  .cr-gmenu .cr-gmenu-none { color: var(--muted); }

  .cr-work { display: grid; grid-template-columns: 158px 1fr 172px; gap: 14px; padding: 12px 0 10px; align-items: start; }
  @media (max-width: 640px) { .cr-work { grid-template-columns: 1fr; } }
  .cr-col { min-width: 0; }
  .cr-colh { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .cr-panelcard { background: linear-gradient(180deg, var(--card), var(--card2)); border: 1px solid var(--cr-border-soft); border-radius: 13px; padding: 13px; }

  .cr-glist { display: flex; flex-direction: column; gap: 5px; }
  .cr-gbtn { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; background: none; color: var(--text); text-align: left; font: inherit; font-size: 13px; width: 100%; transition: 0.15s; }
  .cr-gbtn:hover { background: #5c1727; }
  .cr-gbtn.on { background: #5c1727; border-color: var(--accent); }
  .cr-gc { margin-left: auto; font-size: 10px; color: var(--muted); }
  .cr-gnone { margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center; padding: 7px; border: 1px dashed var(--cr-border-soft); border-radius: 8px; cursor: pointer; }
  .cr-gnone:hover { border-color: var(--cr-border); color: var(--cr-text2); }

  .cr-stage { background: #2f0a15; border: 1px solid var(--cr-border-soft); border-radius: 14px; overflow: hidden; min-height: 420px; }
  .cr-stagebar { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-bottom: 1px solid var(--cr-border-soft); background: #360b18; font-size: 12px; color: var(--muted); }
  .cr-crumb b { color: var(--text); font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 14px; }
  .cr-mode { margin-left: auto; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 3px 10px; font-weight: 700; }
  .cr-mode.grp { color: var(--cr-verified); background: none; border: 1px solid #3f6e52; }
  .cr-stageinner { }
  .cr-ssplit { display: grid; grid-template-columns: 1fr 1px 1fr; }
  .cr-ssplit.single { grid-template-columns: 1fr; }
  @media (max-width: 520px) { .cr-ssplit { grid-template-columns: 1fr; } .cr-sdiv { display: none; } }
  .cr-sdiv { background: var(--cr-border-soft); }
  .cr-sside { padding: 13px; min-width: 0; }
  .cr-slabel { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .cr-slabel .p { color: var(--accent-ink); background: var(--accent); border-radius: 5px; padding: 2px 7px; }
  .cr-slabel .g { color: var(--cr-verified); border: 1px solid #3f6e52; border-radius: 5px; padding: 2px 7px; }
  .cr-note { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
  .cr-readonly { font-size: 10px; color: var(--muted); margin-top: 10px; font-style: italic; }

  .cr-box { display: grid; gap: 8px; }
  .cr-box.split { grid-template-columns: 1fr 1fr; }
  .cr-box.gallery { grid-template-columns: 1fr 1fr; }
  .cr-box.gallery .cr-tile:first-child:not(.cr-add) { grid-column: 1 / 3; min-height: 88px; }
  .cr-box.feed { grid-template-columns: 1fr; }
  .cr-box.feed .cr-tile { min-height: 82px; }
  .cr-box.showcase { grid-template-columns: 1fr 1fr; }
  .cr-box.showcase .cr-tile:first-child:not(.cr-add) { grid-column: 1 / 3; min-height: 100px; }
  .cr-box.stream { grid-template-columns: 1fr; }
  .cr-box.stream .cr-tile { min-height: 42px; }
  .cr-emptybox { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 11px; padding: 22px 8px; border: 1px dashed var(--cr-border-soft); border-radius: 7px; }

  .cr-tile { border-radius: 7px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; min-height: 56px; background: var(--cr-tile); border: 1px solid var(--cr-border-soft); background-size: cover; background-position: center; }
  .cr-tile .cr-ic { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); opacity: 0.5; }
  .cr-tile .cr-ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cr-tile .cr-ty { position: absolute; top: 5px; left: 7px; font-size: 7.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); z-index: 1; }
  .cr-tile span { font-size: 9.5px; color: var(--cr-text2); padding: 6px; z-index: 1; font-weight: 500; position: relative; background: linear-gradient(transparent, rgba(0,0,0,0.45)); }
  .cr-tile .cr-mk { position: absolute; top: 4px; right: 4px; font-size: 8px; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(0,0,0,0.5); border-radius: 999px; padding: 2px 6px; z-index: 1; }
  .cr-mk.v { color: var(--cr-verified); }
  .cr-mk.p { color: var(--accent); }
  .cr-mk.n { color: #fff; }

  .cr-drop { margin-top: 12px; border: 1.5px dashed var(--cr-border); border-radius: 9px; padding: 10px; background: #360b18; }
  .cr-dcap { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .cr-drop .btn { margin-right: 6px; margin-bottom: 4px; font-size: 0.76rem; padding: 0.4rem 0.7rem; }
  .cr-linkform { display: grid; gap: 6px; margin-top: 6px; }
  .cr-linkform input, .cr-linkform select { width: 100%; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 7px; color: var(--text); padding: 0.4rem 0.55rem; font: inherit; font-size: 0.82rem; }
  .cr-linkform select { accent-color: var(--accent); }
  /* interactive blank slot — the place you add content */
  .cr-tile.cr-add { background: #360b18; border: 1.5px dashed var(--cr-border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; color: var(--muted); transition: border-color .15s, color .15s; }
  .cr-tile.cr-add:hover { border-color: var(--accent); color: var(--accent); }
  .cr-add-plus { font-size: 20px; line-height: 1; }
  .cr-add-lbl { font-size: 10px; letter-spacing: 0.05em; }
  .cr-add-link { font-size: 9px; text-decoration: underline; margin-top: 3px; }
  .cr-add-link:hover { color: var(--accent); }

  .cr-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .cr-chip { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--cr-text2); background: #3a0f1d; border: 1px solid var(--cr-border-soft); border-radius: 999px; padding: 5px 11px; }
  .cr-chipav { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-size: 8px; font-weight: 700; color: var(--accent-ink); flex: none; }

  .cr-rail { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cr-arrbtn { cursor: pointer; border: 1px solid var(--cr-border-soft); background: #3a0f1d; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; transition: 0.15s; }
  .cr-arrbtn:hover { border-color: var(--cr-border); }
  .cr-arrbtn.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cr-anm { font-size: 9.5px; font-weight: 600; text-align: center; }
  .cr-arrbtn.on .cr-anm { color: var(--accent); }
  .cr-athumb { height: 20px; border-radius: 4px; background: #2f0a15; padding: 3px; display: grid; gap: 2px; }
  .cr-athumb i { background: var(--cr-border); border-radius: 2px; }
  .cr-t-split { grid-template-columns: 1fr 1fr; }
  .cr-t-gallery { grid-template-columns: 1fr 1fr 1fr; }
  .cr-t-feed { grid-template-rows: 1fr 1fr; }
  .cr-t-showcase { grid-template-rows: 1.4fr 1fr; grid-template-columns: 1fr 1fr 1fr; }
  .cr-t-showcase i:first-child { grid-column: 1 / 4; }
  .cr-t-stream { grid-template-rows: 1fr 1fr 1fr; }
  .cr-railcap { font-size: 10px; color: var(--muted); text-align: center; margin-top: 8px; line-height: 1.4; }
  .cr-empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; font-size: 0.85rem; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="box">
    <img class="login-logo" src="https://wizardshit.store/wizshtlogo_trans.png" alt="Madam Studio" onerror="this.style.display='none'">
    <h2>Madam Studio</h2>
    <p>Owners only — enter the admin password.</p>
    <input type="password" id="pwInput" placeholder="password" autocomplete="current-password">
    <button class="btn primary" id="pwBtn" style="width:100%">Enter</button>
    <div id="gDivider" style="display:none;margin:0.9rem 0 0.7rem;font-size:0.78rem;color:var(--muted)">or</div>
    <div id="gBtn" style="display:flex;justify-content:center"></div>
    <div id="loginErr"></div>
  </div>
</div>

<div class="wrap">
  <header>
    <h1>Madam Studio</h1>
    <div class="sub">Control Room</div>
    <div id="whoami"></div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="claims">Wizard IDs</button>
    <button class="tab" data-tab="creators">Creators</button>
    <button class="tab" data-tab="uploads">Uploads</button>
    <button class="tab" data-tab="payments">Payments</button>
    <button class="tab" data-tab="apps">Apps</button>
    <button class="tab" data-tab="panels">Panels</button>
  </nav>

  <div class="toolbar">
    <button class="btn" id="addBtn">+ Add</button>
    <span id="dirtyFlag">● unsaved changes</span>
    <span style="flex:1"></span>
    <button class="btn" id="reloadBtn">Reload</button>
    <button class="btn primary" id="saveBtn">Save &amp; publish</button>
  </div>

  <div id="list"></div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  // The overlay is up from the first paint; these two decide whether it is
  // showing the password box or getting out of the way.
  function showLoginPrompt() {
    var ov = document.getElementById('loginOverlay');
    ov.style.display = 'flex';
    ov.classList.add('ask');
  }
  function hideLoginPrompt() {
    var ov = document.getElementById('loginOverlay');
    ov.classList.remove('ask');
    ov.style.display = 'none';
  }

  var API = "https://wizardshit.store";

  var state = { merch: [], credits: [], donators: [], panels: [] };
  var claims = null;       // fetched on first visit to WIZARD IDS
  var uploads = null;      // fetched on first visit to UPLOADS / CREATORS
  var pickedCreator = '';  // the creator selected in the split CREATORS dashboard
  var payments = null;     // fetched on first visit to PAYMENTS
  var apps = null;         // fetched on first visit to APPS
  var googleReady = false;
  var tab = 'claims';
  var dirty = false;
  var SITE = 'https://wizardshit.store/';

  var listEl = document.getElementById('list');
  var toastEl = document.getElementById('toast');
  var dirtyEl = document.getElementById('dirtyFlag');

  function toast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.className = isErr ? 'error' : '';
    toastEl.style.display = 'block';
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.style.display = 'none'; }, isErr ? 6000 : 2500);
  }

  function setDirty(v) {
    dirty = v;
    dirtyEl.style.display = v ? 'inline' : 'none';
  }
  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---- auth-aware fetch ---- */
  function authHeaders() {
    var h = {};
    var pw = sessionStorage.getItem('madampw');
    if (pw) h['Authorization'] = 'Bearer ' + pw;
    return h;
  }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, authHeaders());
    return fetch(API + path, opts).then(function (res) {
      if (res.status === 401) {
        showLoginPrompt();
        setupGoogleButton();
        throw new Error('login required');
      }
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      });
    });
  }

  /* ---- Google sign-in on the login overlay ---- */
  function setupGoogleButton() {
    if (googleReady) return;
    fetch(API + '/api/login-config')
      .then(function (r) { return r.json(); })
      .then(function (cfg) {
        if (!cfg.google_client_id) return;
        var s = document.createElement('script');
        s.src = 'https://accounts.google.com/gsi/client';
        s.async = true;
        s.onload = function () {
          if (googleReady || !window.google) return;
          googleReady = true;
          window.google.accounts.id.initialize({
            client_id: cfg.google_client_id,
            callback: function (resp) {
              fetch(API + '/api/glogin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credential: resp.credential })
              })
                .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
                .then(function (out) {
                  if (!out.ok) {
                    var err = document.getElementById('loginErr');
                    err.textContent = out.d.error || 'Sign-in failed';
                    err.style.display = 'block';
                    return;
                  }
                  sessionStorage.setItem('madampw', out.d.token);
                  hideLoginPrompt();
                  boot();
                })
                .catch(function () { toast('Network error', true); });
            }
          });
          document.getElementById('gDivider').style.display = 'block';
          window.google.accounts.id.renderButton(document.getElementById('gBtn'), {
            theme: 'filled_black', size: 'large', text: 'signin_with', width: 260
          });
        };
        document.head.appendChild(s);
      })
      .catch(function () {});
  }

  document.getElementById('pwBtn').onclick = tryLogin;
  document.getElementById('pwInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryLogin();
  });
  function tryLogin() {
    var pw = document.getElementById('pwInput').value;
    sessionStorage.setItem('madampw', pw);
    fetch(API + '/api/admin/login', { method: 'POST', headers: authHeaders() })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (out) {
        if (!out.ok) {
          sessionStorage.removeItem('madampw');
          var err = document.getElementById('loginErr');
          err.textContent = out.d.error || 'Login failed';
          err.style.display = 'block';
          return;
        }
        hideLoginPrompt();
        boot();
      })
      .catch(function () { toast('Network error', true); });
  }

  /* ---- rendering ---- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function imgPreviewUrl(v) {
    if (!v) return '';
    if (/^https?:\/\//i.test(v)) return v;
    return SITE + v.replace(/^\//, '');
  }

  function field(labelText, value, onInput, full, multiline) {
    var box = el('div', full ? 'full' : '');
    box.appendChild(el('label', '', labelText));
    var input = multiline ? el('textarea') : el('input');
    if (!multiline) input.type = 'text';
    input.value = value || '';
    input.addEventListener('input', function () { onInput(input.value); setDirty(true); });
    box.appendChild(input);
    return box;
  }

  // The picture, a drag-and-drop zone, and an upload button — the file's
  // address is tracked behind the scenes, owners never see it.
  function imageField(labelText, item, key, round) {
    var box = el('div', 'full');
    box.appendChild(el('label', '', labelText));
    var zone = el('div', 'dropzone');
    var thumb = el('div', 'thumb' + (round ? ' round' : ''));
    thumb.style.width = '72px';
    thumb.style.height = '72px';
    function refresh() {
      var u = imgPreviewUrl(item[key]);
      thumb.style.backgroundImage = u ? 'url("' + u.replace(/"/g, '%22') + '")' : 'none';
    }
    refresh();
    var hint = el('div', 'drop-hint', 'drag a picture here, or');
    var up = el('button', 'btn', item[key] ? 'Change image' : 'Upload image');
    up.type = 'button';
    var file = el('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.style.display = 'none';

    function doUpload(f) {
      if (!f) return;
      if (!/^image\//.test(f.type)) { toast('That is not an image file', true); return; }
      up.disabled = true;
      up.textContent = '...';
      fetch(API + '/api/admin/upload?name=' + encodeURIComponent(f.name), {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': f.type }, authHeaders()),
        body: f
      })
        .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'upload failed'); return d; }); })
        .then(function (d) {
          item[key] = d.url;
          refresh();
          setDirty(true);
          toast('Image uploaded');
        })
        .catch(function (e) { toast(e.message, true); })
        .then(function () {
          up.disabled = false;
          up.textContent = item[key] ? 'Change image' : 'Upload image';
        });
    }

    up.onclick = function () { file.click(); };
    thumb.style.cursor = 'pointer';
    thumb.title = 'Click to pick an image';
    thumb.onclick = function () { file.click(); };
    file.addEventListener('change', function () { doUpload(file.files[0]); file.value = ''; });

    ['dragenter', 'dragover'].forEach(function (evName) {
      zone.addEventListener(evName, function (e) { e.preventDefault(); zone.classList.add('dragging'); });
    });
    ['dragleave', 'drop'].forEach(function (evName) {
      zone.addEventListener(evName, function (e) { e.preventDefault(); zone.classList.remove('dragging'); });
    });
    zone.addEventListener('drop', function (e) {
      doUpload(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
    });

    zone.appendChild(thumb);
    zone.appendChild(hint);
    zone.appendChild(up);
    zone.appendChild(file);
    box.appendChild(zone);
    return box;
  }

  function itemShell(items, i, titleText, bodyEl) {
    var item = items[i];
    var card = el('div', 'item' + (item.visible ? '' : ' hidden-item'));
    var head = el('div', 'item-head');
    var title = el('strong', 'grow', titleText || '(untitled)');
    title.style.letterSpacing = '0.06em';
    head.appendChild(title);

    var upB = el('button', 'icon-btn', '↑');
    upB.title = 'Move up';
    upB.onclick = function () { if (i > 0) { items.splice(i - 1, 0, items.splice(i, 1)[0]); setDirty(true); render(); } };
    var downB = el('button', 'icon-btn', '↓');
    downB.title = 'Move down';
    downB.onclick = function () { if (i < items.length - 1) { items.splice(i + 1, 0, items.splice(i, 1)[0]); setDirty(true); render(); } };
    var eyeB = el('button', 'icon-btn', item.visible ? '👁' : '✖');
    eyeB.title = item.visible ? 'Visible on the site — click to hide' : 'Hidden from the site — click to show';
    eyeB.onclick = function () { item.visible = item.visible ? 0 : 1; setDirty(true); render(); };
    var delB = el('button', 'icon-btn danger', '🗑');
    delB.title = 'Delete';
    delB.onclick = function () {
      if (confirm('Delete "' + (titleText || 'this item') + '"? (Takes effect when you hit SAVE)')) {
        items.splice(i, 1);
        setDirty(true);
        render();
      }
    };
    head.appendChild(upB);
    head.appendChild(downB);
    head.appendChild(eyeB);
    head.appendChild(delB);
    card.appendChild(head);
    card.appendChild(bodyEl);
    return card;
  }

  // Square panels for the madamstudio creator pages. "creator" must match a
  // credit card name exactly; the word "shared" puts the panel in the
  // recent-projects column that every creator's page shows on the right.
  function renderPanels() {
    state.panels.forEach(function (item, i) {
      var body = el('div', 'fields');
      body.appendChild(field('Creator (credit card name, or "shared")', item.creator, function (v) { item.creator = v; }));
      body.appendChild(field('Title', item.title, function (v) { item.title = v; }));
      body.appendChild(field('Link (optional — where clicking the panel goes)', item.url, function (v) { item.url = v; }, true));
      body.appendChild(imageField('Picture', item, 'image'));
      listEl.appendChild(itemShell(state.panels, i, (item.creator || '?') + ' — ' + (item.title || '(untitled)'), body));
    });
  }

  /* ---- wizard ID claims ---- */
  function loadClaims() {
    api('/api/admin/claims')
      .then(function (d) { claims = d.claims; render(); })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); });
  }

  function claimAction(id, pathSuffix, method) {
    api('/api/admin/claims/' + id + pathSuffix, { method: method }).then(loadClaims)
      .catch(function (e) { toast(e.message, true); });
  }

  // Verify board. Each claim is a light: red = requested, yellow = staged,
  // green = on (this account can now use the creator hub). Deny parks it.
  var LIGHT = { pending: ['🔴', 'Requested'], staged: ['🟡', 'Staged'], verified: ['🟢', 'On'], denied: ['⚫', 'Denied'] };
  function renderClaims() {
    if (claims === null) {
      listEl.appendChild(el('div', 'empty', 'Fetching the verify board…'));
      return;
    }
    if (!claims.length) {
      listEl.appendChild(el('div', 'empty', 'No claims yet. When someone signs in and claims their crew card on madamstudio, they land here: red → stage to yellow → turn on to green to open their hub.'));
      return;
    }
    claims.forEach(function (c) {
      var light = LIGHT[c.status] || LIGHT.pending;
      var card = el('div', 'item' + (c.status === 'pending' ? ' unread' : ''));
      var head = el('div', 'item-head');
      var who = c.credit_name + ' — ' + c.email + (c.account_username ? ' (@' + c.account_username + ')' : '');
      head.appendChild(el('strong', 'grow', light[0] + ' ' + who));
      head.appendChild(el('span', 'msg-meta', light[1].toUpperCase() + ' · ' + (c.created_at || '').slice(0, 16)));
      if (c.status !== 'staged' && c.status !== 'verified') {
        var stageB = el('button', 'btn', 'Stage');
        stageB.onclick = function () { claimAction(c.id, '/stage', 'POST'); };
        head.appendChild(stageB);
      }
      if (c.status !== 'verified') {
        var onB = el('button', 'btn', 'Turn on');
        onB.title = 'Verify — opens their creator hub';
        onB.onclick = function () { claimAction(c.id, '/verify', 'POST'); };
        head.appendChild(onB);
      } else {
        var offB = el('button', 'btn', 'Turn off');
        offB.title = 'Back to staged — closes their hub';
        offB.onclick = function () { claimAction(c.id, '/stage', 'POST'); };
        head.appendChild(offB);
      }
      if (c.status !== 'denied') {
        var noB = el('button', 'icon-btn', '✕');
        noB.title = 'Deny';
        noB.onclick = function () { claimAction(c.id, '/deny', 'POST'); };
        head.appendChild(noB);
      }
      var delB = el('button', 'icon-btn danger', '🗑');
      delB.title = 'Delete';
      delB.onclick = function () {
        claimAction(c.id, '', 'DELETE');
      };
      head.appendChild(delB);
      card.appendChild(head);
      listEl.appendChild(card);
    });
  }

  /* ---- applications ---- */
  function loadApps() {
    api('/api/admin/applications')
      .then(function (d) { apps = d.applications; render(); })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); });
  }

  function renderApps() {
    if (apps === null) {
      listEl.appendChild(el('div', 'empty', 'Fetching applications…'));
      return;
    }
    if (!apps.length) {
      listEl.appendChild(el('div', 'empty', 'No applications yet. The Apply page on madamstudio delivers here — and only here.'));
      return;
    }
    apps.forEach(function (a) {
      var card = el('div', 'item' + (a.read ? '' : ' unread'));
      var head = el('div', 'item-head');
      head.appendChild(el('strong', 'grow', (a.name || 'anonymous') + ' — ' + a.email));
      head.appendChild(el('span', 'msg-meta', (a.created_at || '').slice(0, 16)));
      var readB = el('button', 'icon-btn', a.read ? '↺' : '✓');
      readB.title = a.read ? 'Mark unread' : 'Mark read';
      readB.onclick = function () {
        api('/api/admin/applications/' + a.id + '/read', { method: 'POST' }).then(loadApps)
          .catch(function (e) { toast(e.message, true); });
      };
      var delB = el('button', 'icon-btn danger', '🗑');
      delB.title = 'Delete';
      delB.onclick = function () {
        if (!confirm('Delete this application forever?')) return;
        api('/api/admin/applications/' + a.id, { method: 'DELETE' }).then(loadApps)
          .catch(function (e) { toast(e.message, true); });
      };
      head.appendChild(readB);
      head.appendChild(delB);
      card.appendChild(head);
      if (a.portfolio) {
        var link = el('div', 'msg-body');
        var aEl = el('a', '', a.portfolio);
        aEl.href = a.portfolio;
        aEl.target = '_blank';
        aEl.rel = 'noopener';
        link.appendChild(aEl);
        card.appendChild(link);
      }
      if (a.message) card.appendChild(el('div', 'msg-body', a.message));
      listEl.appendChild(card);
    });
  }

  /* ---- creator work uploads ---- */
  function loadUploads() {
    api('/api/admin/uploads')
      .then(function (d) { uploads = d.uploads; render(); })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); });
  }

  function uploadAction(id, pathSuffix, method) {
    api('/api/admin/uploads/' + id + pathSuffix, { method: method }).then(loadUploads)
      .catch(function (e) { toast(e.message, true); });
  }

  function renderUploads() {
    if (uploads === null) {
      listEl.appendChild(el('div', 'empty', 'Fetching uploads…'));
      return;
    }
    if (!uploads.length) {
      listEl.appendChild(el('div', 'empty', 'No uploads yet. Creators send work from their madamstudio page; it lands here to be marked seen, verified, and paid.'));
      return;
    }
    uploads.forEach(function (u) {
      var card = el('div', 'item' + (u.status === 'new' ? ' unread' : ''));
      var head = el('div', 'item-head');
      var thumb = el('a', 'thumb');
      thumb.href = u.image;
      thumb.target = '_blank';
      thumb.style.width = '52px';
      thumb.style.height = '52px';
      thumb.style.flexShrink = '0';
      thumb.style.backgroundImage = 'url("' + (u.image || '').replace(/"/g, '%22') + '")';
      thumb.title = 'Open full size';
      head.appendChild(thumb);
      head.appendChild(el('strong', 'grow', u.creator + (u.title ? ' — ' + u.title : '')));
      head.appendChild(el('span', 'msg-meta', u.status.toUpperCase() + ' · ' + (u.created_at || '').slice(0, 16)));
      ['seen', 'verified', 'paid'].forEach(function (s) {
        if (u.status === s) return;
        var b = el('button', 'btn', s);
        b.style.textTransform = 'uppercase';
        b.onclick = function () { uploadAction(u.id, '/' + s, 'POST'); };
        head.appendChild(b);
      });
      var delB = el('button', 'icon-btn danger', '🗑');
      delB.title = 'Delete (also removes the image)';
      delB.onclick = function () {
        if (!confirm('Delete this upload forever?')) return;
        uploadAction(u.id, '', 'DELETE');
      };
      head.appendChild(delB);
      card.appendChild(head);
      listEl.appendChild(card);
    });
  }

  /* ---- Creators: Board Editor ----
     Cards row up top (every creator, with a peek of their content and a group
     control). Left = the fixed Groups panel. Middle = the split board: for a
     selected creator, LEFT is their own content (drop images / add links) and
     RIGHT is the read-only public/shared board; for a selected group, one drop
     that lands on every member. Right = the vertical Arrangement rail, which
     sets the selected creator's arrangement (individual) or the public board's
     arrangement (group). Drives creator-config, public-arrangement, upload-for
     and upload-link. */
  var crState = { person: null, group: null, publicArr: null, publicFetched: false, groupMenu: null };
  var CR_GROUPS = [
    { key: 'Advertising', color: '#c9603f' },
    { key: 'Animation', color: '#8a6bb0' },
    { key: 'Animatic', color: '#4a938c' }
  ];
  var CR_ARRS = ['split', 'gallery', 'feed', 'showcase', 'stream'];
  var CR_ARR_LBL = { split: 'Split', gallery: 'Gallery', feed: 'Feed', showcase: 'Showcase', stream: 'Stream' };
  var CR_ICONS = {
    image: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.6"/><path d="M20 16l-4.5-4.5L8 19"/></svg>',
    video: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M11 9.2l4 2.8-4 2.8z" fill="currentColor" stroke="none"/></svg>',
    music: '<svg viewBox="0 0 24 24"><path d="M9 17V5l10-2v11"/><circle cx="6.5" cy="17" r="2.4"/><circle cx="16.5" cy="14" r="2.4"/></svg>',
    link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.5.5l2-2A5 5 0 0012.5 4.5l-1.2 1.2"/><path d="M14 11a5 5 0 00-7.5-.5l-2 2A5 5 0 0011.5 19.5l1.2-1.2"/></svg>',
    file: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>'
  };

  function crCreditByName(name) {
    var a = state.credits || [];
    for (var i = 0; i < a.length; i++) { if (a[i] && a[i].name === name) return a[i]; }
    return null;
  }
  function crFindGroup(key) {
    var k = String(key || '').toLowerCase();
    for (var i = 0; i < CR_GROUPS.length; i++) { if (CR_GROUPS[i].key.toLowerCase() === k) return CR_GROUPS[i]; }
    return null;
  }
  function crInGroup(c, key) { return String((c && c.board_group) || '').toLowerCase() === String(key).toLowerCase(); }
  function crInitials(name) {
    var parts = String(name || '').trim().split(/\s+/);
    var s = (parts[0] || '')[0] || '';
    if (parts[1]) s += (parts[1][0] || '');
    return s.toUpperCase() || '?';
  }
  function crEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function crUploadsFor(name) {
    return (uploads || []).filter(function (u) { return u.creator === name; })
      .slice().sort(function (a, b) { return String(b.created_at || '').localeCompare(String(a.created_at || '')); });
  }

  /* ---- backend calls (creator-config / public-arrangement / upload-for / upload-link) ---- */
  function crSetGroup(name, key) {
    api('/api/admin/creator-config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, board_group: key })
    }).then(function () {
      var c = crCreditByName(name); if (c) c.board_group = key;
      crState.groupMenu = null;
      toast(key ? ('Moved to ' + key) : 'Group cleared');
      render();
    }).catch(function (e) { if (e.message !== 'login required') toast(e.message, true); });
  }
  function crArrSaveErr(e) {
    if (e.message === 'login required') return;
    toast(/not found/i.test(e.message) ? 'Layout preview only — deploy the Worker to save it.' : e.message, true);
  }
  function crSetIndividualArr(name, arr) {
    var c = crCreditByName(name); if (c) c.arrangement = arr;
    render(); // show the new layout immediately
    api('/api/admin/creator-config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, arrangement: arr })
    }).catch(crArrSaveErr);
  }
  function crSetPublicArr(arr) {
    crState.publicArr = arr;
    render(); // show the new layout immediately
    api('/api/admin/public-arrangement', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ arrangement: arr })
    }).catch(crArrSaveErr);
  }
  function crFetchPublicArr() {
    crState.publicFetched = true;
    api('/api/admin/public-arrangement')
      .then(function (d) { crState.publicArr = (d && d.arrangement) ? d.arrangement : 'split'; render(); })
      .catch(function () { /* keep default */ });
  }
  function crUploadImage(name, file, btn) {
    btn.disabled = true; var old = btn.textContent; btn.textContent = 'Uploading…';
    var title = file.name.replace(/\.[a-z0-9]+$/i, '').slice(0, 100);
    fetch(API + '/api/admin/upload-for?creator=' + encodeURIComponent(name) + '&title=' + encodeURIComponent(title), {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': file.type }, authHeaders()),
      body: file
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'upload failed'); return d; }); })
      .then(function () { toast('Added to ' + name); loadUploads(); })
      .catch(function (e) { toast(e.message, true); btn.disabled = false; btn.textContent = old; });
  }
  function crAddLink(name, url, title, type, btn) {
    btn.disabled = true;
    api('/api/admin/upload-link', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ creator: name, title: title, url: url, type: type })
    }).then(function () { toast('Link added to ' + name); loadUploads(); })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); btn.disabled = false; });
  }
  function crUploadImageToGroup(members, file, btn) {
    btn.disabled = true; var old = btn.textContent; btn.textContent = 'Uploading…';
    var title = file.name.replace(/\.[a-z0-9]+$/i, '').slice(0, 100);
    Promise.all(members.map(function (m) {
      return fetch(API + '/api/admin/upload-for?creator=' + encodeURIComponent(m.name) + '&title=' + encodeURIComponent(title), {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': file.type }, authHeaders()),
        body: file
      }).then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'upload failed'); return d; }); });
    })).then(function () { toast('Added to ' + members.length + ' boards'); loadUploads(); })
      .catch(function (e) { toast(e.message, true); btn.disabled = false; btn.textContent = old; });
  }
  function crAddLinkToGroup(members, url, title, type, btn) {
    btn.disabled = true;
    Promise.all(members.map(function (m) {
      return api('/api/admin/upload-link', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ creator: m.name, title: title, url: url, type: type })
      });
    })).then(function () { toast('Link added to ' + members.length + ' boards'); loadUploads(); })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); btn.disabled = false; });
  }

  /* ---- media-slot tile ---- */
  function crStatusMark(status) {
    if (status === 'paid') return ['p', 'paid'];
    if (status === 'verified') return ['v', 'verified'];
    if (status === 'seen') return ['v', 'seen'];
    if (status === 'new') return ['n', 'new'];
    return null;
  }
  function crTile(u) {
    var d = el('div', 'cr-tile');
    var mt = u.media_type || 'image';
    var hasImg = mt === 'image' && u.image;
    if (hasImg) {
      d.style.backgroundImage = 'url("' + imgPreviewUrl(u.image).replace(/"/g, '%22') + '")';
    } else {
      var ic = el('div', 'cr-ic'); ic.innerHTML = CR_ICONS[mt] || CR_ICONS.file; d.appendChild(ic);
    }
    d.appendChild(el('div', 'cr-ty', mt));
    d.appendChild(el('span', '', u.title || '(untitled)'));
    var mk = crStatusMark(u.status);
    if (mk) d.appendChild(el('div', 'cr-mk ' + mk[0], mk[1]));
    return d;
  }
  // A read-only box passes no handlers; an editable box passes {onImage,onLink}
  // and gets a blank "＋ add" slot appended — that slot IS the upload target.
  function crGuessType(u) {
    u = (u || '').toLowerCase();
    if (/youtube\.com|youtu\.be|vimeo\.com|\.mp4|\.mov|\.webm/.test(u)) return 'video';
    if (/spotify\.com|soundcloud\.com|\.mp3|\.wav|\.ogg|\.m4a/.test(u)) return 'music';
    if (/\.png|\.jpe?g|\.gif|\.webp|\.svg/.test(u)) return 'image';
    if (/\.pdf|\.zip|\.psd|\.ai|\.docx?|\.txt/.test(u)) return 'file';
    return 'link';
  }
  function crAddSlot(handlers) {
    var slot = el('div', 'cr-tile cr-add');
    slot.appendChild(el('div', 'cr-add-plus', '＋'));
    slot.appendChild(el('div', 'cr-add-lbl', 'Add image'));
    var file = el('input'); file.type = 'file'; file.accept = 'image/*'; file.style.display = 'none';
    slot.appendChild(file);
    slot.onclick = function () { file.click(); };
    file.onchange = function () { var f = file.files[0]; file.value = ''; if (f) handlers.onImage(f, slot); };
    var link = el('div', 'cr-add-link', 'or paste a link');
    link.onclick = function (ev) {
      ev.stopPropagation();
      var raw = window.prompt('Paste a link (video, image, audio, file — any URL):');
      if (!raw) return;
      var u = raw.trim();
      if (!/^https?:\/\//i.test(u)) { toast('Link must start with http(s)://', true); return; }
      var t = window.prompt('Title (optional):', '') || '';
      handlers.onLink(u, t, crGuessType(u), slot);
    };
    slot.appendChild(link);
    return slot;
  }
  function crFillBox(boxEl, items, arr, handlers) {
    var a = CR_ARRS.indexOf(arr) >= 0 ? arr : 'split';
    boxEl.className = 'cr-box ' + a;
    if (!items.length && !handlers) { boxEl.appendChild(el('div', 'cr-emptybox', 'Nothing here yet.')); return; }
    items.forEach(function (u) { boxEl.appendChild(crTile(u)); });
    if (handlers) {
      // Fill out the current row (and give an empty board a full row) with blank
      // "＋ add" slots, so a Split/Gallery/Showcase board shows two across.
      var cols = (a === 'feed' || a === 'stream') ? 1 : 2;
      var rem = items.length % cols;
      var need = rem === 0 ? cols : cols - rem;
      for (var i = 0; i < need; i++) boxEl.appendChild(crAddSlot(handlers));
    }
  }

  /* ---- drop control: Upload image + Add link ---- */
  function crDropControl(label, onImage, onLink) {
    var wrap = el('div', 'cr-drop');
    wrap.appendChild(el('div', 'cr-dcap', label));
    var imgBtn = el('button', 'btn primary', 'Upload image'); imgBtn.type = 'button';
    var file = el('input'); file.type = 'file'; file.accept = 'image/*'; file.style.display = 'none';
    imgBtn.onclick = function () { file.click(); };
    file.onchange = function () { var f = file.files[0]; file.value = ''; if (f) onImage(f, imgBtn); };
    var linkBtn = el('button', 'btn', 'Add link'); linkBtn.type = 'button';
    var form = el('div', 'cr-linkform'); form.style.display = 'none';
    var url = el('input'); url.type = 'text'; url.placeholder = 'https://…  (URL)';
    var title = el('input'); title.type = 'text'; title.placeholder = 'title';
    var sel = el('select');
    ['link', 'video', 'music', 'file', 'image'].forEach(function (t) { sel.appendChild(new Option(t, t)); });
    var addBtn = el('button', 'btn primary', 'Add'); addBtn.type = 'button';
    addBtn.onclick = function () {
      var u = url.value.trim();
      if (!u) { toast('Enter a URL', true); return; }
      onLink(u, title.value.trim(), sel.value, addBtn);
    };
    linkBtn.onclick = function () { form.style.display = form.style.display === 'none' ? '' : 'none'; };
    form.appendChild(url); form.appendChild(title); form.appendChild(sel); form.appendChild(addBtn);
    wrap.appendChild(imgBtn); wrap.appendChild(linkBtn); wrap.appendChild(file); wrap.appendChild(form);
    return wrap;
  }

  /* ---- top cards row ---- */
  function crCardEl(c) {
    var card = el('div', 'cr-pcard' + (crState.person === c.name ? ' on' : ''));
    var g = crFindGroup(c.board_group);
    var color = g ? g.color : '#7a2a3c';
    var row1 = el('div', 'cr-row1');
    var av = el('div', 'cr-av');
    var photo = c.photo ? imgPreviewUrl(c.photo) : '';
    if (photo) { av.style.backgroundImage = 'url("' + photo.replace(/"/g, '%22') + '")'; }
    else { av.textContent = crInitials(c.name); av.style.background = color; }
    row1.appendChild(av);
    var meta = el('div');
    meta.appendChild(el('div', 'cr-nm', c.name));
    if (c.roles) meta.appendChild(el('div', 'cr-rl', c.roles));
    row1.appendChild(meta);
    card.appendChild(row1);

    var ups = crUploadsFor(c.name).slice(0, 3);
    var thumbs = el('div', 'cr-thumbs');
    for (var i = 0; i < 3; i++) {
      var t = el('i');
      var u = ups[i];
      if (u && u.media_type === 'image' && u.image) { t.style.backgroundImage = 'url("' + imgPreviewUrl(u.image).replace(/"/g, '%22') + '")'; }
      thumbs.appendChild(t);
    }
    card.appendChild(thumbs);

    var tag = el('div', 'cr-gtag');
    var dot = el('span', 'cr-gdot'); dot.style.background = color; tag.appendChild(dot);
    tag.appendChild(document.createTextNode(g ? g.key : 'No group'));
    tag.appendChild(el('span', 'cr-chev', '▾'));
    tag.onclick = function (e) { e.stopPropagation(); crState.groupMenu = (crState.groupMenu === c.name ? null : c.name); render(); };
    card.appendChild(tag);

    if (crState.groupMenu === c.name) {
      var menu = el('div', 'cr-gmenu');
      CR_GROUPS.forEach(function (gr) {
        var b = el('button', '', gr.key); b.type = 'button';
        b.onclick = function (e) { e.stopPropagation(); crSetGroup(c.name, gr.key); };
        menu.appendChild(b);
      });
      var none = el('button', 'cr-gmenu-none', 'No group'); none.type = 'button';
      none.onclick = function (e) { e.stopPropagation(); crSetGroup(c.name, ''); };
      menu.appendChild(none);
      card.appendChild(menu);
    }

    card.onclick = function () { crState.person = c.name; crState.group = null; crState.groupMenu = null; render(); };
    return card;
  }

  /* ---- left: Groups panel ---- */
  function crGroupsCol(creds) {
    var col = el('div', 'cr-col');
    var pc = el('div', 'cr-panelcard');
    pc.appendChild(el('div', 'cr-colh', 'Groups'));
    var glist = el('div', 'cr-glist');
    CR_GROUPS.forEach(function (g) {
      var count = creds.filter(function (c) { return crInGroup(c, g.key); }).length;
      var b = el('button', 'cr-gbtn' + (crState.group === g.key ? ' on' : '')); b.type = 'button';
      var dot = el('span', 'cr-gdot'); dot.style.background = g.color; b.appendChild(dot);
      b.appendChild(document.createTextNode(g.key));
      b.appendChild(el('span', 'cr-gc', String(count)));
      b.onclick = function () { crState.group = g.key; crState.person = null; crState.groupMenu = null; render(); };
      glist.appendChild(b);
    });
    pc.appendChild(glist);
    var none = el('div', 'cr-gnone', '✕ No group · edit individuals');
    none.onclick = function () { crState.group = null; crState.person = null; render(); };
    pc.appendChild(none);
    col.appendChild(pc);
    return col;
  }

  /* ---- middle: the board ---- */
  function crBoardCol(creds) {
    var col = el('div', 'cr-col');
    var stage = el('div', 'cr-stage');
    var bar = el('div', 'cr-stagebar');
    var crumb = el('span', 'cr-crumb');
    var mode = el('span', 'cr-mode');
    bar.appendChild(crumb); bar.appendChild(mode);
    stage.appendChild(bar);
    var inner = el('div', 'cr-stageinner');
    stage.appendChild(inner);

    if (crState.person && !crCreditByName(crState.person)) crState.person = null;

    if (crState.person) {
      var c = crCreditByName(crState.person);
      crumb.innerHTML = 'Editing <b>' + crEsc(c.name) + '</b>';
      mode.textContent = 'Individual'; mode.className = 'cr-mode';
      var wrap = el('div', 'cr-ssplit');
      var L = el('div', 'cr-sside');
      var ll = el('p', 'cr-slabel'); ll.appendChild(el('span', 'p', 'Their board')); L.appendChild(ll);
      var lbox = el('div');
      crFillBox(lbox, crUploadsFor(c.name), c.arrangement || 'split', {
        onImage: function (f, btn) { crUploadImage(c.name, f, btn); },
        onLink: function (u, t, ty, btn) { crAddLink(c.name, u, t, ty, btn); }
      });
      L.appendChild(lbox);
      var D = el('div', 'cr-sdiv');
      var R = el('div', 'cr-sside');
      var rl = el('p', 'cr-slabel'); rl.appendChild(el('span', 'g', 'Public · everyone sees this')); R.appendChild(rl);
      var rbox = el('div');
      crFillBox(rbox, crUploadsFor('shared'), crState.publicArr || 'split');
      R.appendChild(rbox);
      R.appendChild(el('div', 'cr-readonly', 'Read-only here · the same public board everyone sees.'));
      wrap.appendChild(L); wrap.appendChild(D); wrap.appendChild(R);
      inner.appendChild(wrap);
    } else if (crState.group) {
      var g = crFindGroup(crState.group);
      var gname = g ? g.key : crState.group;
      var members = creds.filter(function (x) { return crInGroup(x, crState.group); });
      crumb.innerHTML = 'Editing group <b>' + crEsc(gname) + '</b>';
      mode.textContent = 'Group · adds to each member'; mode.className = 'cr-mode grp';
      var single = el('div', 'cr-ssplit single');
      var S = el('div', 'cr-sside');
      var sl = el('p', 'cr-slabel'); sl.appendChild(el('span', 'g', gname + ' — ' + members.length + ' members')); S.appendChild(sl);
      S.appendChild(el('p', 'cr-note', "Drop a piece here and it lands on every member’s individual board at once."));
      if (!members.length) {
        S.appendChild(el('div', 'cr-emptybox', 'No members yet — assign creators via the tag on their card.'));
      } else {
        var gbox = el('div');
        crFillBox(gbox, [], 'gallery', {
          onImage: function (f, btn) { crUploadImageToGroup(members, f, btn); },
          onLink: function (u, t, ty, btn) { crAddLinkToGroup(members, u, t, ty, btn); }
        });
        S.appendChild(gbox);
        var chips = el('div', 'cr-chips');
        members.forEach(function (m) {
          var mg = crFindGroup(m.board_group);
          var chip = el('span', 'cr-chip');
          var ci = el('span', 'cr-chipav'); ci.style.background = mg ? mg.color : '#7a2a3c'; ci.textContent = crInitials(m.name);
          chip.appendChild(ci);
          chip.appendChild(document.createTextNode(m.name + ' · ' + crUploadsFor(m.name).length));
          chips.appendChild(chip);
        });
        S.appendChild(chips);
      }
      single.appendChild(S);
      inner.appendChild(single);
    } else {
      crumb.textContent = 'Select a card'; mode.style.display = 'none';
      inner.appendChild(el('div', 'cr-empty', "Pick a person’s card above to edit their split board — or a group on the left to drop content for everyone in it."));
    }
    col.appendChild(stage);
    return col;
  }

  /* ---- right: vertical Arrangement rail ---- */
  function crRailCol() {
    var col = el('div', 'cr-col');
    col.appendChild(el('div', 'cr-colh', 'Arrangement'));
    var rail = el('div', 'cr-rail');

  function renderCreators() {
    if (uploads === null) {
      listEl.appendChild(el('div', 'cr-empty', 'Loading the board editor…'));
      return;
    }
    if (!crState.publicFetched) crFetchPublicArr();

    top.appendChild(el('div', 'cr-h1b', 'Board Editor'));

    root.appendChild(top);

  /* ---- payments ---- */
  function loadPayments() {
    api('/api/admin/payments')
      .then(function (d) { payments = d.payments; render(); })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); });
  }

  function money(n) { return '$' + (Number(n) || 0).toFixed(2); }

  function renderPayments() {
    if (payments === null) {
      listEl.appendChild(el('div', 'empty', 'Fetching payments…'));
      return;
    }
    // "Record a payment" form: creator dropdown from credits, amount, note.
    var form = el('div', 'item');
    var fields = el('div', 'fields');
    var creatorNames = state.credits.map(function (c) { return c.name; }).filter(Boolean);
    var selWrap = el('div', 'full');
    selWrap.appendChild(el('label', '', 'Creator'));
    var sel = el('select');
    sel.appendChild(new Option('Select a creator…', ''));
    creatorNames.forEach(function (n) { sel.appendChild(new Option(n, n)); });
    selWrap.appendChild(sel);
    fields.appendChild(selWrap);
    var amtWrap = el('div');
    amtWrap.appendChild(el('label', '', 'Amount ($)'));
    var amt = el('input'); amt.type = 'number'; amt.min = '0'; amt.step = '0.01';
    amtWrap.appendChild(amt);
    fields.appendChild(amtWrap);
    var noteWrap = el('div');
    noteWrap.appendChild(el('label', '', 'Note (what for)'));
    var note = el('input'); note.type = 'text';
    noteWrap.appendChild(note);
    fields.appendChild(noteWrap);
    var payBtn = el('button', 'btn primary', 'Record payment');
    payBtn.onclick = function () {
      if (!sel.value) { toast('Pick a creator', true); return; }
      if (!(Number(amt.value) > 0)) { toast('Enter an amount', true); return; }
      payBtn.disabled = true;
      api('/api/admin/payments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ creator: sel.value, amount: Number(amt.value), note: note.value }),
      }).then(function () { toast('Payment recorded'); payments = null; loadPayments(); })
        .catch(function (e) { toast(e.message, true); payBtn.disabled = false; });
    };
    fields.appendChild(payBtn);
    form.appendChild(fields);
    listEl.appendChild(form);

    if (!payments.length) {
      listEl.appendChild(el('div', 'empty', 'No payments recorded yet.'));
      return;
    }
    // Per-creator totals.
    var totals = {};
    payments.forEach(function (p) { totals[p.creator] = (totals[p.creator] || 0) + (Number(p.amount) || 0); });
    var grand = payments.reduce(function (s, p) { return s + (Number(p.amount) || 0); }, 0);
    var sum = el('div', 'item');
    sum.appendChild(el('strong', '', 'Paid out: ' + money(grand)));
    var byLine = Object.keys(totals).map(function (k) { return k + ' ' + money(totals[k]); }).join('  ·  ');
    sum.appendChild(el('div', 'msg-meta', byLine));
    listEl.appendChild(sum);

    payments.forEach(function (p) {
      var card = el('div', 'item');
      var head = el('div', 'item-head');
      head.appendChild(el('strong', 'grow', p.creator + ' — ' + money(p.amount) + (p.note ? '  (' + p.note + ')' : '')));
      head.appendChild(el('span', 'msg-meta', (p.created_at || '').slice(0, 16)));
      var delB = el('button', 'icon-btn danger', '🗑');
      delB.title = 'Delete';
      delB.onclick = function () {
        if (!confirm('Delete this payment record?')) return;
        api('/api/admin/payments/' + p.id, { method: 'DELETE' }).then(function () { payments = null; loadPayments(); })
          .catch(function (e) { toast(e.message, true); });
      };
      head.appendChild(delB);
      card.appendChild(head);
      listEl.appendChild(card);
    });
  }

  function render() {
    listEl.innerHTML = '';
    var editable = tab === 'panels';
    document.getElementById('addBtn').style.display = editable ? '' : 'none';
    document.getElementById('saveBtn').style.display = editable ? '' : 'none';
    if (tab === 'claims') { renderClaims(); return; }
    else if (tab === 'creators') { renderCreators(); return; }
    else if (tab === 'uploads') { renderUploads(); return; }
    else if (tab === 'payments') { renderPayments(); return; }
    else if (tab === 'apps') { renderApps(); return; }
    else if (tab === 'panels') renderPanels();
    if (!state[tab].length) {
      listEl.appendChild(el('div', 'empty', 'Nothing here yet — hit + ADD.'));
    }
  }

  /* ---- toolbar ---- */
  document.querySelectorAll('.tab').forEach(function (btn) {
    btn.onclick = function () {
      document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      tab = btn.dataset.tab;
      render();
      if (tab === 'claims' && claims === null) loadClaims();
      if ((tab === 'uploads' || tab === 'creators') && uploads === null) loadUploads();
      if (tab === 'payments' && payments === null) loadPayments();
      if (tab === 'apps' && apps === null) loadApps();
    };
  });

  document.getElementById('addBtn').onclick = function () {
    var fresh;
    if (tab === 'panels') fresh = { creator: '', title: '', url: '', image: '', visible: 1 };
    else return;
    state[tab].unshift(fresh);
    setDirty(true);
    render();
  };

  document.getElementById('reloadBtn').onclick = function () {
    if (tab === 'claims') { claims = null; render(); loadClaims(); return; }
    if (tab === 'uploads' || tab === 'creators') { uploads = null; render(); loadUploads(); return; }
    if (tab === 'payments') { payments = null; render(); loadPayments(); return; }
    if (tab === 'apps') { apps = null; render(); loadApps(); return; }
    if (dirty && !confirm('Throw away unsaved changes and reload?')) return;
    load();
  };

  document.getElementById('saveBtn').onclick = function () {
    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    api('/api/admin/collection/' + tab, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state[tab])
    })
      .then(function (d) {
        setDirty(false);
        toast('Saved — ' + d.saved + ' item' + (d.saved === 1 ? '' : 's') + ' live on the site ✨');
      })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); })
      .then(function () { btn.disabled = false; });
  };

  /* ---- boot ---- */
  function load() {
    api('/api/admin/content')
      .then(function (data) {
        state = data;
        setDirty(false);
        render();
      })
      .catch(function (e) { if (e.message !== 'login required') toast(e.message, true); });
  }

  function boot() {
    fetch(API + '/api/admin/login', { method: 'POST', headers: authHeaders() })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
      .then(function (out) {
        if (!out.ok) {
          if (out.status === 401) {
            showLoginPrompt();
            setupGoogleButton();
          } else {
            // Not an auth problem — get the cover out of the way so the
            // console and the error are both visible.
            hideLoginPrompt();
            toast(out.d.error || 'Backend not ready', true);
          }
          return;
        }
        hideLoginPrompt();
        document.getElementById('whoami').textContent =
          'logged in' + (out.d.email && out.d.email !== 'owner' ? ' as ' + out.d.email : '') +
          (out.d.mode === 'access' ? ' via Cloudflare Access' : out.d.mode === 'google' ? ' via Google' : '');
        load();
      })
      .catch(function () { hideLoginPrompt(); toast('Cannot reach the backend', true); });
  }

  boot();
})();
</script>
</body>
</html>
