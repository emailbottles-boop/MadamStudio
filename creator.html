<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator — Madam Studio</title>
<meta name="description" content="A Madam Studio creator's page: their work, links, and the studio's latest projects.">
<link rel="icon" type="image/png" href="img/favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap');

  /* Flat light-blue theme — matches index.html, no gradients. */
  :root {
    --bg:      #d9e9f4;
    --panel:   #ffffff;
    --panel-2: #eef6fb;
    --border:  #b3cfe1;
    --text:    #16303f;
    --text-2:  #3d5b6e;
    --muted:   #5b7c92;
    --accent:  #2176b5;
    --accent-deep: #175a8c;
    --verified: #1e8e5a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height: 100vh;
  }

  .corner-nav { position: fixed; top: 24px; right: 24px; z-index: 10; display: flex; gap: 10px; }
  .studio-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 3px;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .studio-btn:hover { border-color: var(--accent); background: var(--panel-2); }
  .studio-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1060px; margin: 0 auto; padding: 100px 24px 80px; }

  /* ── creator header ──────────────────────────────── */
  .who {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .who-photo {
    width: 92px; height: 92px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }
  .who-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who h1 { font-family: 'Fraunces', Georgia, serif; font-size: clamp(24px, 4.5vw, 36px); font-weight: 700; letter-spacing: -0.02em; color: var(--accent-deep); }
  .who .roles { font-size: 13px; color: var(--muted); white-space: pre-line; line-height: 1.5; margin-top: 4px; }
  .who .id-badge {
    display: inline-block;
    margin-top: 8px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--verified);
    border: 1px solid var(--verified);
    border-radius: 3px;
    padding: 3px 8px;
  }

  /* ── split layout ────────────────────────────────── */
  .split {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 34px;
    align-items: start;
  }

  .col-label {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }

  .panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }

  .sq {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    display: block;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, transform 0.15s;
  }
  a.sq:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.sq:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sq img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sq .cap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.94);
    border-top: 1px solid var(--border);
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sq .cap .ext { color: var(--accent); font-size: 12px; }
  .sq.no-img { display: flex; align-items: center; justify-content: center; padding: 18px; text-align: center; }
  .sq.no-img .cap { position: static; background: none; border: none; padding: 0; font-size: 15px; justify-content: center; }

  .side .sq { aspect-ratio: auto; }
  .side .sq img { aspect-ratio: 16 / 10; }
  .side .panel-grid { grid-template-columns: 1fr; }

  .empty-note {
    font-size: 13px;
    color: var(--muted);
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 22px 18px;
    text-align: center;
    line-height: 1.6;
  }

  footer {
    text-align: center;
    padding: 26px 20px 34px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 760px) {
    .corner-nav { top: 16px; right: 16px; }
    .studio-btn { font-size: 11px; padding: 9px 13px; }
    .wrap { padding-top: 88px; }
    .split { grid-template-columns: 1fr; }
    .side { border-top: 1px solid var(--border); padding-top: 26px; }
  }
</style>
</head>
<body>

  <nav class="corner-nav">
    <a class="studio-btn" href="crew.html">Wizard ID</a>
    <a class="studio-btn" href="index.html">Madam Studio</a>
  </nav>

  <div class="wrap">
    <header class="who">
      <div class="who-photo" id="whoPhoto"></div>
      <div>
        <h1 id="whoName">&hellip;</h1>
        <div class="roles" id="whoRoles"></div>
        <span class="id-badge" id="whoBadge" hidden>✓ Verified wizard</span>
      </div>
    </header>

    <div class="split">
      <section aria-label="This creator's panels">
        <div class="col-label" id="mineLabel">Their corner</div>
        <div class="panel-grid" id="mineGrid"></div>
      </section>

      <aside class="side" aria-label="Recent studio projects">
        <div class="col-label">Recent projects</div>
        <div class="panel-grid" id="sharedGrid"></div>
      </aside>
    </div>
  </div>

  <footer>
    &copy; Madam Studio &mdash; All Rights Reserved &middot; NFP (Not For Profit)
  </footer>

<script>
/* Everything on this page comes from the studio API: the creator's identity
   from the credits, their square panels and the shared recent-projects
   column from the panels collection (edited in the Control Room's PANELS
   tab). The page itself never needs touching. */
const API = "https://wizardshit.store";

const params = new URLSearchParams(location.search);
const NAME = (params.get("name") || "").trim();

const whoPhoto = document.getElementById("whoPhoto");
const whoName = document.getElementById("whoName");
const whoRoles = document.getElementById("whoRoles");
const whoBadge = document.getElementById("whoBadge");
const mineGrid = document.getElementById("mineGrid");
const sharedGrid = document.getElementById("sharedGrid");

function initials(name) {
  return name.split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase() || "?";
}
function imgUrl(path) {
  return /^https?:\/\//i.test(path) ? path : API + "/" + path.replace(/^\/+/, "");
}

function panelEl(p) {
  const hasLink = /^https?:\/\//i.test(p.url || "");
  const node = document.createElement(hasLink ? "a" : "div");
  node.className = "sq" + (p.image ? "" : " no-img");
  if (hasLink) {
    node.href = p.url;
    node.target = "_blank";
    node.rel = "noopener";
  }
  if (p.image) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = p.title || "";
    img.src = imgUrl(p.image);
    node.appendChild(img);
  }
  if (p.title || !p.image) {
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = p.title || "";
    if (hasLink) {
      const ext = document.createElement("span");
      ext.className = "ext";
      ext.textContent = "↗";
      cap.appendChild(ext);
    }
    node.appendChild(cap);
  }
  return node;
}

function fillGrid(grid, panels, emptyText) {
  grid.innerHTML = "";
  if (!panels.length) {
    const note = document.createElement("div");
    note.className = "empty-note";
    note.textContent = emptyText;
    grid.appendChild(note);
    return;
  }
  panels.forEach(p => grid.appendChild(panelEl(p)));
}

(async () => {
  if (!NAME) { location.replace("crew.html"); return; }

  document.title = NAME + " — Madam Studio";
  whoName.textContent = NAME;
  whoPhoto.textContent = initials(NAME);
  document.getElementById("mineLabel").textContent = NAME.split(/\s+/)[0] + "'s corner";

  let credits = [], panels = [], verified = [];
  try {
    const res = await fetch(API + "/api/content");
    if (res.ok) {
      const data = await res.json();
      credits = data.credits || [];
      panels = data.panels || [];
    }
  } catch (_) {}
  try {
    const res = await fetch(API + "/api/claims-public");
    if (res.ok) verified = (await res.json()).verified || [];
  } catch (_) {}

  const me = credits.find(c => c.name === NAME);
  if (me) {
    whoRoles.textContent = me.roles || "";
    if (me.photo) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = imgUrl(me.photo);
      img.onerror = () => { img.remove(); whoPhoto.textContent = initials(NAME); };
      whoPhoto.textContent = "";
      whoPhoto.appendChild(img);
    }
  }
  whoBadge.hidden = !verified.includes(NAME);

  fillGrid(mineGrid, panels.filter(p => p.creator === NAME),
    "Nothing here yet — the producers will drop " + NAME.split(/\s+/)[0] + "'s stuff here soon.");
  fillGrid(sharedGrid, panels.filter(p => (p.creator || "").toLowerCase() === "shared"),
    "The studio's latest projects will show up here.");
})();
</script>

</body>
</html>
